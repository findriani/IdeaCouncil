# User Research Profile - Example
# Copy this file to user_profile.yaml and fill in your own details.
# Every field is injected into council prompts so models generate ideas
# that fit your actual situation. Be specific - vague entries produce vague ideas.

research_interests:
  primary_fields:
    - Machine Learning
    - Computer Science
    - Deep Learning

  specific_topics:
    - Lightweight model architectures for edge deployment
    - Feature engineering and feature extraction
    - applied machine learning

  avoid_topics:
    - Pure NLP or large language model training (out of scope)
    - Wet-lab biology or chemistry experiments
    - Theoretical mathematics with no implementation component


constraints:
  expertise:
    - Undergraduate final-year student (Informatics / Computer Science)
    - Comfortable with Python, scikit-learn, PyTorch basics
    - Familiar with pandas, NumPy, matplotlib
    
  technical:
    - No access to HPC clusters or institutional GPU servers
    - Deep learning models must fit in Google Colab free tier (T4 GPU, ~12 GB VRAM, sessions reset after ~12 hours)
    - Prefer models under 100M parameters unless pre-trained weights are publicly available

  timeline:
    - Total duration 6 months


goals:
  primary: "Publishable at a mid tier regional conference or Scopus-indexed Q2/Q3 journal. Novelty sufficient to clear basic peer review."
  secondary:
    - Working implementation with clear documented code on GitHub
    - Results visualised with charts or demo (not just tables of numbers)
    - Methodology clear enough that a fellow could reproduce it
    - Ideally applicable to Indonesian healthcare or agricultural or environmental context


resources:
  computational:
    - Personal laptop - Windows 11, 16 GB RAM, Intel Core i5, no discrete GPU
    - Google Colab free tier (T4 GPU, ~12 GB VRAM)
    - Google Drive 15 GB for dataset storage

  datasets:
    - Public repositories - Kaggle, UCI ML Repository, PhysioNet
    - Can download datasets up to ~2 GB (storage constraint)
    - Cannot collect new data or access hospital/clinical databases

  budget:
    api_costs: "Minimal - $0 to $20/month total for all LLM API usage"
    other: "Student budget, no research grant or institutional funding. Cannot purchase proprietary datasets or paid tools."


preferences:
  research_style:
    - Applied over theoretical - must produce a working system or experiment
    - Reproducible - all experiments scriptable, results deterministic with fixed random seeds
    - Prefer incremental novelty over high-risk moonshots
    - Favour pipelines that combine existing techniques in a new way over designing new algorithms from scratch

  output_format:
    - Clean Python code with README and requirements.txt on GitHub
    - Figures and plots suitable for thesis inclusion
    - Results table comparing proposed method vs at least 2 baselines
