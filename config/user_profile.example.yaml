# User Research Profile — Example
# ─────────────────────────────────────────────────────────────────────────────
# Copy this file to user_profile.yaml and fill in your own details.
# Every field is injected into council prompts so models generate ideas that
# fit your actual situation. Be specific — vague entries produce vague ideas.
# ─────────────────────────────────────────────────────────────────────────────

research_interests:
  primary_fields:
    - Machine Learning
    - Computer Science
    - Biomedical Signal Processing

  specific_topics:
    - Physiological signal classification (ECG, PPG, EEG)
    - Lightweight model architectures for edge deployment
    - Feature engineering for time-series data
    - Explainability and interpretability (SHAP, LIME, Grad-CAM)
    - Data augmentation for imbalanced biomedical datasets

  avoid_topics:
    - Pure NLP / large language model training (out of scope)
    - Wet-lab biology or chemistry experiments
    - Theoretical mathematics with no implementation component
    - Research requiring ethics approval for new human data collection
      (existing public datasets only)


constraints:
  expertise:
    - Undergraduate final-year student (Informatics / Computer Science)
    - Comfortable with Python, scikit-learn, PyTorch basics
    - Familiar with pandas, NumPy, matplotlib
    - Limited experience with advanced mathematics (no measure theory,
      no advanced statistics beyond basic hypothesis testing)
    - No prior publication experience

  technical:
    - No access to HPC clusters or institutional GPU servers
    - Deep learning models must fit in Google Colab free tier (T4 GPU,
      ~12 GB VRAM, sessions reset after ~12 hours)
    - Prefer models under 100M parameters — larger models are acceptable
      only if pre-trained weights are publicly available and fine-tuning
      fits within Colab constraints
    - Cannot collect new primary data (surveys, sensors, clinical trials)
    - No MATLAB license — Python only

  timeline:
    - Total thesis duration: 6 months (one semester)
    - Month 1-2: Literature review and dataset preparation
    - Month 3-4: Implementation and experiments
    - Month 5: Writing and revisions
    - Month 6: Submission and defence
    - Hard deadline: cannot slip — must submit by end of semester


goals:
  primary: >
    Produce a complete, reproducible research contribution publishable at
    a low-to-mid tier regional conference or journal (e.g., national
    informatics conference, Scopus-indexed Q3/Q4 journal). Novelty
    sufficient to clear a basic peer review — not a top-venue paper.
  secondary:
    - Working implementation with clear, documented code on GitHub
    - Results visualised with charts or demo (not just tables of numbers)
    - Methodology clear enough that a fellow undergraduate could reproduce it
    - Ideally applicable to Indonesian healthcare or environmental context
      (makes local contribution angle easier to argue in the thesis)


resources:
  computational:
    - Personal laptop: Windows 11, 8 GB RAM, Intel Core i5, no discrete GPU
    - Google Colab free tier (T4 GPU, ~12 GB VRAM)
    - Google Drive 15 GB (dataset storage)
    - No cloud compute budget (AWS, GCP, Azure are out)

  datasets:
    - Public repositories: Kaggle, UCI ML Repository, PhysioNet
    - Can download datasets up to ~2 GB (storage constraint)
    - Cannot collect new data or access hospital/clinical databases
    - Existing datasets already on hand:
        - PPG + ECG simultaneous recording dataset (multimodal, ~500 subjects)
        - Publicly available Indonesian text dataset (backup option)

  budget:
    api_costs: Minimal — $0 to $20/month total for all LLM API usage
    other: >
      Student budget, no research grant or institutional funding.
      Cannot purchase proprietary datasets or paid tools.


preferences:
  research_style:
    - Applied over theoretical — must produce a working system or experiment
    - Reproducible: all experiments scriptable, results deterministic with
      fixed random seeds
    - Prefer incremental novelty over high-risk moonshots — something that
      reliably works beats something ambitious that might not finish in time
    - Favour pipelines that combine existing techniques in a new way over
      designing new algorithms from scratch

  output_format:
    - Clean Python code with README and requirements.txt on GitHub
    - Figures and plots suitable for thesis inclusion (PDF or high-res PNG)
    - Results table comparing proposed method vs. at least 2 baselines
    - Short demo or notebook walkthrough preferred

  writing_context:
    - Thesis written in Indonesian (Bahasa Indonesia), but code and
      variable names in English
    - Must follow university thesis formatting guidelines
    - Will translate key sections to English if submitting to an
      international venue
