# Available LLM Models Configuration
# Verify latest model IDs and pricing at: https://openrouter.ai/models

available_models:

  # ── Coordinator (converge phase only — not a selectable council member) ─────
  claude_sonnet_latest:
    openrouter_id: "~anthropic/claude-sonnet-latest"
    display_name: "Claude Sonnet (Latest)"
    provider: "Anthropic"
    pricing:
      input_per_1m: 3.0
      output_per_1m: 15.0
    context_window: 1000000
    supports_streaming: true
    recommended_for: ["converge"]

  # ── Council members (default preset) ──────────────────────────────────────
  qwen:
    openrouter_id: "qwen/qwen3.6-plus"
    display_name: "Qwen3.6 Plus"
    provider: "Alibaba"
    pricing:
      input_per_1m: 0.39
      output_per_1m: 2.34
    context_window: 262144
    supports_streaming: true
    recommended_for: ["diverge", "criticize"]

  kimi:
    openrouter_id: "moonshotai/kimi-k2.6"
    display_name: "Kimi K2.6"
    provider: "Moonshot AI"
    pricing:
      input_per_1m: 0.45
      output_per_1m: 2.2
    context_window: 262144
    supports_streaming: true
    is_reasoning_model: true
    diverge_max_tokens: 12000
    criticize_max_tokens: 20000
    recommended_for: ["diverge", "criticize"]

  glm:
    openrouter_id: "z-ai/glm-5.1"
    display_name: "GLM-5.1"
    provider: "Zhipu AI"
    pricing:
      input_per_1m: 0.8
      output_per_1m: 2.56
    context_window: 202752
    supports_streaming: true
    is_reasoning_model: true
    diverge_max_tokens: 12000
    criticize_max_tokens: 20000
    recommended_for: ["diverge", "criticize"]

  deepseek:
    openrouter_id: "deepseek/deepseek-v4-pro"
    display_name: "DeepSeek V4 Pro"
    provider: "DeepSeek"
    pricing:
      input_per_1m: 0.5
      output_per_1m: 2.15
    context_window: 163840
    supports_streaming: true
    recommended_for: ["diverge", "criticize"]

  grok:
    openrouter_id: "x-ai/grok-4.3"
    display_name: "Grok 4.3"
    provider: "xAI"
    pricing:
      input_per_1m: 3.0
      output_per_1m: 15.0
    context_window: 131072
    supports_streaming: true
    recommended_for: ["diverge", "criticize"]

  gemini:
    openrouter_id: "google/gemini-3.1-pro-preview"
    display_name: "Gemini 3.1 Pro"
    provider: "Google"
    pricing:
      input_per_1m: 2.0
      output_per_1m: 12.0
    context_window: 1048576
    supports_streaming: true
    recommended_for: ["diverge", "criticize"]

  chatgpt:
    openrouter_id: "openai/gpt-5.4"
    display_name: "GPT-5.4"
    provider: "OpenAI"
    pricing:
      input_per_1m: 2.5
      output_per_1m: 15.0
    context_window: 1050000
    supports_streaming: true
    recommended_for: ["diverge", "criticize"]


# Preset configurations
presets:
  default:
    name: "Default (Recommended)"
    models: ["qwen", "kimi", "glm", "deepseek", "grok", "gemini", "chatgpt"]
    description: "Diverse council spanning frontier models from multiple providers"
    estimated_cost_per_iteration: 0.60


# Phase-specific settings
phase_settings:
  diverge:
    temperature: 0.9
    max_tokens: 6000
    ideas_per_member: 4

  literature_check:
    enabled: true
    year_range: 5                  # search current_year-5 to current_year
    papers_per_query: 5            # top N results per query per API
    num_queries: 6                 # number of search queries to generate
    summarizer_model: "google/gemini-3.1-flash-lite-preview"
    query_generator_model: "google/gemini-3.1-flash-lite-preview"
    pricing:                       # OpenRouter pricing for the summarizer model
      input_per_1m: 0.10
      output_per_1m: 0.40

  criticize:
    temperature: 0.5
    max_tokens: 12000
    exclude_own_ideas: true
    # Only these model keys participate as critics (all models still generate ideas in diverge)
    critic_models: ["claude_sonnet_latest", "kimi", "deepseek", "chatgpt"]
    novelty_critic: "kimi"         # dedicated novelty scorer — reviews ALL ideas including own
    novelty_max_tokens: 20000      # Kimi needs more tokens for novelty assessments

  converge:
    temperature: 0.3
    max_tokens: 10000
    top_ideas_count: 6
