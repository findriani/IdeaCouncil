# Preset configurations
presets:
  default:
    name: "Default (Recommended)"
    models: ["claude_sonnet", "chatgpt", "gemini_pro", "kimi", "qwen", "glm"]
    description: "Balanced council with diverse perspectives"
    estimated_cost_per_iteration: 0.50

  budget:
    name: "Budget-Conscious"
    models: ["gemini_flash", "glm_flash", "qwen_flash", "chatgpt_budget"]
    description: "Cost-effective options for frequent use"
    estimated_cost_per_iteration: 0.08

  premium:
    name: "Premium Quality"
    models: ["claude_opus", "chatgpt", "gemini_pro", "kimi", "qwen", "qwen_thinking", "glm"]
    description: "Maximum diversity and quality"
    estimated_cost_per_iteration: 1.80


# Phase-specific settings
phase_settings:
  diverge:
    temperature: 0.9
    max_tokens: 2000
    ideas_per_member: 4

  criticize:
    temperature: 0.5
    max_tokens: 1500
    exclude_own_ideas: true

  converge:
    temperature: 0.3
    max_tokens: 6000
    top_ideas_count: 6

